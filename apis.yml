    myaccount Vite SPA, the ln./agency.ailife.com agent locators, the eProvider remittance
    portal) but ships no developer program at all — /developers, /api, /pricing, /status and
    /changelog are hard 404s on the live host, every RFC 8615 well-known path missed on all
    eleven hosts probed, and the api. and developer. subdomains this profile previously
    recorded as its API base and portal are wildcard DNS with no service behind them, answering
    a generic 466-byte HTTP 500 on every path including /docs and /openapi.json.
