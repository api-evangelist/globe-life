description: >-
  Globe Life Inc. (NYSE: GL) is a McKinney, Texas insurance holding company and Fortune 1000
  constituent. Its wholly owned subsidiaries — Globe Life And Accident Insurance Company,
  American Income Life, Globe Life Liberty National Division, United American and Family
  Heritage — sell individual life, accident, supplemental health and Medicare Supplement
  policies direct to consumers and through captive and independent agents. Globe Life's public
  digital surface is entirely consumer- and agent-facing: quote tools, the myaccount
  policyholder portal, an agent locator, the eProvider remittance portal and a mobile app. As
  of the 2026-09-14 probe Globe Life publishes no developer portal, no API reference and no
  machine-readable contract of any kind; partner and distributor integrations are governed by
  bilateral carrier agreements rather than by a public developer program.
