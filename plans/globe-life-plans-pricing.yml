description: >-
  Globe Life publishes NO API plans, because it publishes no API. The company is a life,
  accident and supplemental health carrier whose priced products are consumer insurance
  policies, and even those carry no posted price — every product page routes to a
  quote/underwriting flow keyed on age, coverage amount, term and state. There is no
  developer pricing page, no tier table, and no metered or subscription API product of any
  kind. Partner and distributor economics (commission schedules, quote/bind access) are set
  in bilateral carrier-distributor agreements and are not published.
note: >-
  This artifact previously listed two entries — a consumer "Insurance Policy" plan and an
  "Agent / Partner Integration" plan — written by the 2026-05-04 bulk sweep. Neither is an
  API plan, and carrying them made plan_count read 2 for a company that has published zero
  API plans. They have been removed and plan_count is now an explicit, measured 0. An honest
  zero is the finding; it is not a gap in the probe.
