specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Globe Life
providerId: globe-life
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Insurance
  - Life Insurance
  - Financial Services
description: Globe Life is a life and supplemental health insurance carrier. Its product surface is policyholder-facing
  (life, accident, supplemental health policies) rather than a developer API. No public developer API
  or pricing tier exists; agent / partner integrations are governed by carrier-distributor agreements.
notes: Reconcile only if Globe Life launches a public developer API with posted pricing.
sources:
  - https://www.globelifeinsurance.com/
  - https://home.globelifeinsurance.com/
plans:
  - id: globe-life-policy
    name: Insurance Policy (Consumer Product)
    type: usage-based
    description: Consumer-facing insurance policy — life, accident, or supplemental health. Premiums
      depend on age, coverage amount, term, and underwriting; not an API plan.
    entries:
      - label: Monthly premium
        name: premium
        type: metered
        metric: policy-month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: see Globe Life quote tool
        userMultiplied: false
    elements:
      - name: Term life policies
      - name: Whole life policies
      - name: Accident and supplemental health
      - name: Children's life policies
  - id: globe-life-partner
    name: Agent / Partner Integration
    type: enterprise
    description: Field-agent and partner-distributor integrations governed by carrier-distributor agreement.
      Not a self-service API.
    entries:
      - label: Partner contract
        name: partner_contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: per partner agreement
        userMultiplied: false
    elements:
      - name: Quote and bind workflows
      - name: Commission payout integration
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
